<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Ponzi Roulette</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root { --bg:#090d1a; --text:#f6f7ff; --muted:#98a1bf; --card:#151d33cc; --line:#ffffff22; --acc:#63d9ff; --acc2:#9e67ff; }
      * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
      html,body { height:100%; color:var(--text); font-family: Inter, system-ui, sans-serif; background:
        radial-gradient(130% 75% at 8% -5%, #2652a088, transparent 55%),
        radial-gradient(120% 80% at 90% 0%, #7a32f388, transparent 58%),
        radial-gradient(130% 65% at 50% 100%, #104d6766, transparent 60%),
        linear-gradient(160deg, #090d1a, #060910 70%);
      }
      body { overflow:hidden; }
      .app { max-width:500px; margin:0 auto; min-height:100dvh; position:relative; }
      .screen { position:absolute; inset:0; padding:16px 14px 114px; overflow:auto; opacity:0; transform:translateY(8px); pointer-events:none; transition:.28s; }
      .screen.active { opacity:1; transform:none; pointer-events:auto; }
      .splash { display:grid; place-items:center; text-align:center; }
      .splash h1 { font-size:40px; font-weight:900; text-shadow:0 0 24px #73cbff88; }
      .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; backdrop-filter: blur(6px); }
      .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
      .pill { border:1px solid #ffffff33; border-radius:999px; padding:6px 10px; font-size:12px; color:#dff4ff; background:linear-gradient(120deg,#48d7ff33,#9a65ff33); }
      .title { font-size:22px; font-weight:900; }
      .sub { color:var(--muted); font-size:13px; }
      .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
      .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .stat { background:#0e162bcc; border:1px solid var(--line); border-radius:12px; padding:10px; }
      .stat .v{font-size:18px;font-weight:800}
      .reel-wrap { margin-top:12px; border-radius:14px; border:1px solid var(--line); overflow:hidden; background:#090f20; position:relative; }
      .reel-wrap:after { content:""; position:absolute; top:0; bottom:0; left:50%; width:4px; transform:translateX(-50%); background:linear-gradient(180deg,transparent,#ffd96f 20%,#ffd96f 80%,transparent); box-shadow:0 0 18px #ffd96f; }
      .track { display:flex; transition:transform 4.5s cubic-bezier(.12,.96,.18,1); }
      .tile { min-width:96px; height:78px; display:grid; place-items:center; font-weight:800; font-size:14px; border-right:1px solid #ffffff1c; }
      .usdt{background:linear-gradient(180deg,#1a5a41,#123828)} .boost{background:linear-gradient(180deg,#53349d,#2f1d5e)} .token{background:linear-gradient(180deg,#2f4f97,#1e3360)} .nothing{background:linear-gradient(180deg,#343743,#232632)}
      .btn { width:100%; border:none; border-radius:14px; padding:14px; font-size:18px; font-weight:900; color:#091222; background:linear-gradient(120deg,#58e7ff,#9b72ff); }
      .btn:disabled { opacity:.6; }
      .chips { display:flex; flex-wrap:wrap; gap:6px; }
      .chip { border:1px solid var(--line); border-radius:10px; padding:6px 8px; font-size:12px; background:#0f172b; }
      .list { display:grid; gap:8px; }
      .item { border:1px solid var(--line); border-radius:12px; padding:10px; background:#0f162acc; }
      .item.pending { border-color:#f0d26b66; }
      .mini { font-size:12px; color:var(--muted); }
      .tiny-btn { border:none; border-radius:8px; padding:6px 10px; font-weight:700; background:#36d9a3; color:#082018; }
      .nav { position:fixed; left:0; right:0; bottom:0; max-width:500px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr); gap:6px; padding:8px 8px calc(env(safe-area-inset-bottom,0) + 10px); background:#090f1fe8; border-top:1px solid var(--line); }
      .nbtn { border:none; background:transparent; color:var(--muted); border-radius:10px; padding:8px 2px; font-size:11px; display:grid; gap:4px; place-items:center; }
      .nbtn.active { color:#dbf3ff; background:#4cd7ff22; }
      .lang { display:grid; gap:8px; max-width:330px; margin:40px auto; }
      .lang button{border:none;padding:14px;border-radius:12px;background:#1b2742;color:var(--text);font-weight:800}
      .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;width:calc(100% - 28px);max-width:430px;background:#0d1528f0;border:1px solid var(--line);border-radius:12px;padding:10px;display:none}
    </style>
  </head>
  <body>
    <div class="app">
      <section class="screen active splash" id="splash"><h1>✨ Beta Version</h1></section>
      <section class="screen" id="lang"><div class="lang"><button data-lang="ru">🇷🇺 Русский</button><button data-lang="en">🇬🇧 English</button></div></section>
      <section class="screen" id="main">
        <div class="card">
          <div class="row"><span class="pill">🎉 BETA ROULETTE</span><span class="pill" id="balance">💰 --</span></div>
          <div class="title mt8" id="title">🎰 Рулетка Ponzi</div>
          <div class="sub mt8" id="winLabel">Выиграно: Более 5000USDT</div>
          <div class="stats mt12"><div class="stat"><div class="mini">💸 Стоимость прокрута</div><div class="v">3$</div></div><div class="stat"><div class="mini">🏆 Шанс победы</div><div class="v" id="chance">--%</div></div></div>
          <div class="reel-wrap"><div class="track" id="track"></div></div>
          <div class="sub mt8" id="result">🎁 Крути и забирай призы</div>
          <button class="btn mt12" id="spinBtn">🚀 Start</button>
        </div>
        <div class="card mt12" id="tabContent"></div>
      </section>
      <nav class="nav" id="nav"></nav>
      <div class="toast" id="toast"></div>
    </div>

    <script>
      const i18n = {
        ru: {
          tabs:{spin:"🎰 Рулетка", prizes:"🎁 Призы", can:"📦 Что можно выиграть", token:"🪙 Token Ponzi", deposit:"💳 Депозит", withdraw:"💸 Вывод"},
          title:"🎰 Рулетка Ponzi", won:"Выиграно: Более 5000USDT", start:"🚀 Start", spinning:"🎲 Крутится...",
          hint:"🎁 Призы начисляются автоматически. Boost активируй во вкладке Призы.",
          noWins:"Пока побед нет. Сделайте первый прокрут!", activate:"Активировать Boost", activated:"✅ Boost активирован", needPool:"⚠️ Откройте пул, чтобы активировать Boost", already:"⚠️ Boost уже активирован", nothing:"😶 Ничего не выйграно", insuff:"❌ Недостаточно баланса. Нужно 3$", loadErr:"⚠️ Не удалось обновить данные",
          devInfo:"🚧 В Разработке...",
        },
        en: {
          tabs:{spin:"🎰 Roulette", prizes:"🎁 Prizes", can:"📦 Can win", token:"🪙 Ponzi Token", deposit:"💳 Deposit", withdraw:"💸 Withdraw"},
          title:"🎰 Ponzi Roulette", won:"Won: More than 5000USDT", start:"🚀 Start", spinning:"🎲 Spinning...",
          hint:"🎁 Rewards are credited automatically. Activate Boost in Prizes tab.",
          noWins:"No wins yet. Make your first spin!", activate:"Activate Boost", activated:"✅ Boost activated", needPool:"⚠️ Open a pool to activate Boost", already:"⚠️ Boost already activated", nothing:"😶 Nothing won", insuff:"❌ Insufficient balance. Need $3", loadErr:"⚠️ Failed to refresh data",
          devInfo:"🚧 In development...",
        }
      };
      const tabIds = ["spin","prizes","can","token","deposit","withdraw"];
      const state = { lang: localStorage.getItem("miniapp_lang") || null, tab:"spin", userId:0, spinning:false, profile:null };
      const catalog = [
        {t:"usdt",l:"4$"},{t:"usdt",l:"5$"},{t:"usdt",l:"2$"},{t:"usdt",l:"7$"},{t:"usdt",l:"10$"},{t:"usdt",l:"15$"},{t:"usdt",l:"20$"},{t:"usdt",l:"25$"},{t:"usdt",l:"50$"},{t:"usdt",l:"250$"},{t:"usdt",l:"200$"},{t:"usdt",l:"300$"},{t:"usdt",l:"500$"},{t:"usdt",l:"600$"},{t:"usdt",l:"1000$"},
        {t:"boost",l:"Буст +3% 24ч"},{t:"nothing",l:"Ничего не выйграно"},{t:"token",l:"10.000 токенов"},{t:"token",l:"15.000 токенов"},{t:"token",l:"5.000 токенов"},
      ];

      const el = {
        splash: document.getElementById("splash"), lang:document.getElementById("lang"), main:document.getElementById("main"),
        nav:document.getElementById("nav"), title:document.getElementById("title"), winLabel:document.getElementById("winLabel"),
        track:document.getElementById("track"), result:document.getElementById("result"), spinBtn:document.getElementById("spinBtn"),
        balance:document.getElementById("balance"), chance:document.getElementById("chance"), tabContent:document.getElementById("tabContent"), toast:document.getElementById("toast")
      };

      let tickTimer = null;
      const tg = () => window.Telegram?.WebApp;
      const cls = (name) => ["splash","lang","main"].forEach((k)=>el[k].classList.toggle("active", k===name));
      const toast = (m)=>{el.toast.textContent=m;el.toast.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.toast.style.display='none',2600)};
      const API_BASE = 'https://something-random.trycloudflare.com';
      const api = async (path, method='GET', body=null) => {
        const r = await fetch(`${API_BASE}${path}`,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null});
        return r.json();
      };

      function playTick(){
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const o = ac.createOscillator();
          const g = ac.createGain();
          o.type='square'; o.frequency.value=980;
          g.gain.value=0.03;
          o.connect(g); g.connect(ac.destination);
          o.start(); o.stop(ac.currentTime + 0.04);
        } catch (_) {}
      }

      function tileClass(type){ return type==='boost'?'boost':type==='token'?'token':type==='nothing'?'nothing':'usdt'; }
      function tileText(item){ if(item.t==='boost')return '🚀 +3% 24ч'; if(item.t==='token')return '🪙 '+item.l; if(item.t==='nothing')return '😶 0'; return '💵 '+item.l; }
      function buildTrack(){
        const list=[...catalog,...catalog,...catalog];
        el.track.innerHTML=list.map(i=>`<div class="tile ${tileClass(i.t)}">${tileText(i)}</div>`).join('');
      }

      function renderNav(){
        const d=i18n[state.lang];
        el.nav.innerHTML=tabIds.map(t=>`<button class="nbtn ${state.tab===t?'active':''}" data-tab="${t}"><span>${d.tabs[t].split(' ')[0]}</span><span>${d.tabs[t].replace(/^\S+\s?/,'')}</span></button>`).join('');
      }

      function renderTab(){
        const d=i18n[state.lang];
        if(state.tab==='prizes'){
          const wins=state.profile?.wins||[];
          const html = wins.length ? wins.map(w=>{
            const canActivate = w.prize_type==='boost' && w.status==='pending_activation';
            return `<div class="item ${canActivate?'pending':''}"><div class="row"><b>🎁 ${w.prize_label}</b><span class="mini">${w.status}</span></div>${canActivate?`<button class="tiny-btn mt8" data-activate="${w.id}">${d.activate}</button>`:''}</div>`;
          }).join('') : `<div class="mini">${d.noWins}</div>`;
          el.tabContent.innerHTML=`<div class="title" style="font-size:18px">${d.tabs.prizes}</div><div class="list mt8">${html}</div>`;
        } else if(state.tab==='can') {
          el.tabContent.innerHTML=`<div class="title" style="font-size:18px">${d.tabs.can}</div><div class="chips mt8">${catalog.map(c=>`<span class="chip">${tileText(c)}</span>`).join('')}</div>`;
        } else {
          el.tabContent.innerHTML=`<div class="title" style="font-size:18px">${d.tabs[state.tab]}</div><div class="sub mt8">${d.devInfo}</div>`;
        }

        if(state.tab==='spin') {
          el.tabContent.innerHTML=`<div class="title" style="font-size:18px">${d.tabs.spin}</div><div class="sub mt8">${d.hint}</div>`;
        }
      }

      function renderBase(){
        const d=i18n[state.lang];
        el.title.textContent=d.title;
        el.winLabel.textContent=d.won;
        el.spinBtn.textContent=d.start;
        el.balance.textContent=`💰 ${(Number(state.profile?.balance) || 0).toFixed(2)}$`;
        el.chance.textContent=`90%`;
        renderNav(); renderTab();
      }

      async function refreshProfile(){
        if(!state.userId) return;
        try {
          const data=await api(`/api/profile?user_id=${state.userId}`);
          if(data.ok){ state.profile=data; renderBase(); }
          else toast(i18n[state.lang].loadErr);
        } catch (_) {
          toast(i18n[state.lang].loadErr);
        }
      }

      function animateTo(label){
        const one=96;
        const centerOffset=192;
        const base=[...catalog,...catalog,...catalog];
        const idx = base.findIndex((x,i)=>i>=catalog.length && x.l===label);
        const target = idx>0?idx:catalog.length+Math.floor(Math.random()*catalog.length);
        el.track.style.transform=`translateX(-${target*one-centerOffset}px)`;
      }

      async function doSpin(){
        const d=i18n[state.lang];
        if(state.spinning) return;
        if(!state.userId){ toast(d.loadErr); return; }
        if(!state.profile){ await refreshProfile(); }
        if(!state.profile){ toast(d.loadErr); return; }
        if((Number(state.profile.balance)||0) < 3){ toast(d.insuff); return; }
        state.spinning=true; el.spinBtn.disabled=true; el.result.textContent=d.spinning;
        const fake = catalog[Math.floor(Math.random()*catalog.length)];
        animateTo(fake.l);
        if (tickTimer) clearInterval(tickTimer);
        tickTimer = setInterval(playTick, 130);

        try {
          const res = await api('/api/spin','POST',{user_id:state.userId});
          if(!res.ok){ toast(d.insuff); el.result.textContent=d.hint; return; }
          animateTo(res.prize_label || fake.l);
          await new Promise(resolve => setTimeout(resolve, 4300));
          await refreshProfile();
          el.result.textContent = res.reward==='nothing' ? d.nothing : `🏆 ${res.prize_label}`;
        } catch (_) {
          toast(d.loadErr);
          el.result.textContent=d.hint;
        } finally {
          if (tickTimer) clearInterval(tickTimer);
          state.spinning=false; el.spinBtn.disabled=false;
        }
      }

      async function activateBoost(winId){
        const d=i18n[state.lang];
        try {
          const res=await api('/api/activate_boost','POST',{user_id:state.userId, win_id:winId});
          if(res.status==='ok') toast(d.activated); else if(res.status==='already') toast(d.already); else toast(d.needPool);
          await refreshProfile();
        } catch (_) { toast(d.loadErr); }
      }

      function bind(){
        document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{state.lang=b.dataset.lang;localStorage.setItem('miniapp_lang',state.lang);renderBase();cls('main');refreshProfile();}));
        el.nav.addEventListener('click',(e)=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;renderBase();});
        el.spinBtn.addEventListener('click',doSpin);
        el.tabContent.addEventListener('click',(e)=>{const b=e.target.closest('[data-activate]');if(!b)return;activateBoost(Number(b.dataset.activate));});
      }

      function initUser(){
        const app=tg();
        app?.ready(); app?.expand();
        const uid = Number(app?.initDataUnsafe?.user?.id || new URLSearchParams(location.search).get('user_id') || 0);
        state.userId = uid > 0 ? uid : 0;
      }

      async function start(){
        buildTrack(); initUser(); bind();
        setTimeout(async()=>{
          if(state.lang){ cls('main'); await refreshProfile(); renderBase(); }
          else cls('lang');
        }, 1000);
      }
      start();
    </script>
  </body>
</html>
